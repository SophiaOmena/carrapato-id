<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Amblyomma brasiliense - Carrapato Silvestre da Mata Atlântica e Cerrado -->
  <defs>
    <radialGradient id="brasBody" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="70%" stop-color="#5C2907"/>
      <stop offset="100%" stop-color="#361702"/>
    </radialGradient>
    <radialGradient id="brasScutum" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#B8860B"/>
      <stop offset="65%" stop-color="#805B09"/>
      <stop offset="100%" stop-color="#422E02"/>
    </radialGradient>
  </defs>

  <!-- Pernas articuladas 4 pares -->
  <g stroke="#3D1D04" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M70 70 L34 45 L18 55 L6 72"/>
    <path d="M130 70 L166 45 L182 55 L194 72"/>
    <path d="M68 95 L26 85 L10 102 L2 124"/>
    <path d="M132 95 L174 85 L190 102 L198 124"/>
    <path d="M68 118 L25 120 L14 142 L8 162"/>
    <path d="M132 118 L175 120 L186 142 L192 162"/>
    <path d="M72 140 L36 158 L26 178 L30 196"/>
    <path d="M128 140 L164 158 L174 178 L170 196"/>
  </g>

  <!-- Capítulo longo com palpos proeminentes -->
  <g fill="#4A2606">
    <polygon points="90,48 110,48 107,24 93,24"/>
    <path d="M92 46 L86 20 L92 12 L97 22 L95 46 Z"/>
    <path d="M108 46 L114 20 L108 12 L103 22 L105 46 Z"/>
    <rect x="97" y="10" width="6" height="34" rx="2" fill="#D2B48C"/>
  </g>

  <!-- Idiosoma arredondado com festões -->
  <path d="M100 48 C60 48, 50 82, 50 120 C50 166, 68 180, 100 180 C132 180, 150 166, 150 120 C150 82, 140 48, 100 48 Z"
        fill="url(#brasBody)"/>

  <!-- Festões bem delimitados -->
  <g stroke="#2E1301" stroke-width="2" fill="none">
    <line x1="58" y1="162" x2="50" y2="152"/>
    <line x1="66" y1="170" x2="60" y2="160"/>
    <line x1="75" y1="176" x2="71" y2="165"/>
    <line x1="87" y1="180" x2="85" y2="168"/>
    <line x1="100" y1="180" x2="100" y2="168"/>
    <line x1="113" y1="180" x2="115" y2="168"/>
    <line x1="125" y1="176" x2="129" y2="165"/>
    <line x1="134" y1="170" x2="140" y2="160"/>
    <line x1="142" y1="162" x2="150" y2="152"/>
  </g>

  <!-- Escudo Dorsal com manchas esbranquiçadas e douradas características -->
  <path d="M100 48 C70 48, 64 68, 64 88 C64 114, 84 126, 100 130 C116 126, 136 114, 136 88 C136 68, 130 48, 100 48 Z"
        fill="url(#brasScutum)"/>

  <!-- Desenhos claros do escudo -->
  <g fill="none" stroke="#F5DEB3" stroke-width="2" opacity="0.9">
    <path d="M80 62 Q100 72 120 62"/>
    <path d="M76 85 C84 105, 94 118, 100 124 C106 118, 116 105, 124 85"/>
    <circle cx="100" cy="80" r="4.5" stroke-width="2"/>
    <circle cx="86" cy="98" r="3"/>
    <circle cx="114" cy="98" r="3"/>
  </g>

  <!-- Olhos marginais -->
  <circle cx="66" cy="74" r="2.5" fill="#FFE4B5"/>
  <circle cx="134" cy="74" r="2.5" fill="#FFE4B5"/>
</svg>
