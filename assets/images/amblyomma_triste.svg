<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Amblyomma triste - Carrapato do Pampa/Pantanal (Ixodidae, capítulo longo, escudo com desenho acobreado/dourado) -->
  <defs>
    <radialGradient id="tristeBody" cx="50%" cy="55%" r="50%">
      <stop offset="0%" stop-color="#9C6B38"/>
      <stop offset="70%" stop-color="#6B411B"/>
      <stop offset="100%" stop-color="#3D2109"/>
    </radialGradient>
    <radialGradient id="tristeScutum" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#CFA15A"/>
      <stop offset="60%" stop-color="#A4702E"/>
      <stop offset="100%" stop-color="#5E3811"/>
    </radialGradient>
  </defs>

  <!-- Pernas articuladas 4 pares -->
  <g stroke="#4A290E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M70 70 L35 45 L18 55 L8 70"/>
    <path d="M130 70 L165 45 L182 55 L192 70"/>
    <path d="M68 95 L28 85 L12 102 L4 122"/>
    <path d="M132 95 L172 85 L188 102 L196 122"/>
    <path d="M68 118 L26 120 L15 142 L10 162"/>
    <path d="M132 118 L174 120 L185 142 L190 162"/>
    <path d="M72 140 L38 158 L28 178 L32 195"/>
    <path d="M128 140 L162 158 L172 178 L168 195"/>
  </g>

  <!-- Capítulo longo com palpos delgados e pontiagudos -->
  <g fill="#4A290E">
    <polygon points="90,48 110,48 107,24 93,24"/>
    <!-- Palpos longos e finos -->
    <path d="M92 46 L86 20 L92 12 L97 22 L95 46 Z"/>
    <path d="M108 46 L114 20 L108 12 L103 22 L105 46 Z"/>
    <!-- Hipostômio -->
    <rect x="97" y="10" width="6" height="34" rx="2" fill="#D29A48"/>
  </g>

  <!-- Abdômen / Idiosoma com festões marginais -->
  <path d="M100 48 C62 48, 52 82, 52 120 C52 165, 70 178, 100 178 C130 178, 148 165, 148 120 C148 82, 138 48, 100 48 Z"
        fill="url(#tristeBody)"/>

  <!-- 11 Festões bem marcados na margem posterior -->
  <g stroke="#3D2109" stroke-width="2" fill="none">
    <line x1="60" y1="162" x2="52" y2="152"/>
    <line x1="68" y1="170" x2="62" y2="160"/>
    <line x1="77" y1="175" x2="73" y2="164"/>
    <line x1="88" y1="178" x2="86" y2="166"/>
    <line x1="100" y1="178" x2="100" y2="166"/>
    <line x1="112" y1="178" x2="114" y2="166"/>
    <line x1="123" y1="175" x2="127" y2="164"/>
    <line x1="132" y1="170" x2="138" y2="160"/>
    <line x1="140" y1="162" x2="148" y2="152"/>
  </g>

  <!-- Escudo Dorsal Ornamentado com padrão acobreado/amarelado -->
  <path d="M100 48 C72 48, 66 68, 66 88 C66 112, 85 125, 100 128 C115 125, 134 112, 134 88 C134 68, 128 48, 100 48 Z"
        fill="url(#tristeScutum)"/>

  <!-- Ornamentação em filigrana clara e pontuações do Amblyomma triste -->
  <g fill="none" stroke="#FDE68A" stroke-width="2" opacity="0.9">
    <path d="M82 60 Q100 68 118 60"/>
    <circle cx="100" cy="76" r="5" stroke-width="2"/>
    <path d="M78 85 C85 105, 95 116, 100 122 C105 116, 115 105, 122 85"/>
    <path d="M85 70 Q74 90 84 105"/>
    <path d="M115 70 Q126 90 116 105"/>
  </g>
  <!-- Olhos marginais planos típicos de Amblyomma -->
  <circle cx="68" cy="72" r="2.5" fill="#FEF08A"/>
  <circle cx="132" cy="72" r="2.5" fill="#FEF08A"/>
</svg>
